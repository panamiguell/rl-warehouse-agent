# Parámetros del ambiente (deben coincidir con docs/entrega1).

episodio:
  duracion_turno_min: 480      # 8 horas
  delta_t_min: 2               # avance máximo del reloj con operarios libres
  gamma: 0.95                  # por cada delta_t (descuento por tiempo transcurrido)

centro_distribucion:
  zonas: [A, B, C, D]
  capacidad_carro_lineas: 20   # Cmax

discretizacion:
  wip_lineas: [0, 5, 15]           # w_z: 0 | 1-5 | 6-15 | 16+
  consolidacion_ordenes: [1, 4]    # c_z: sin repetidos | 2-4 | 5+
  holgura_min: [15, 60]            # u_z: <=15 critica | 15-60 | >60
  operarios_max: 3                 # o: 0, 1, 2, 3+
  llegadas_15min: [5, 15]          # lambda: <5 | 5-15 | >15

recompensas:
  visita_ahorrada: 2               # por cada línea que no requiere una visita extra
  costo_viaje: -1                  # por cada lote o urgente despachado
  lote_descuido: -10               # LOTE_z con otra zona crítica y z no crítica
  urgente_sin_urgencia: -4         # URGENTE con u_max = 1
  esperar:
    sin_alternativa: 0
    sin_trabajo: 0
    con_orden_critica: -10
    consolidar_alta_demanda: 0
    sin_llegadas: -3
    ocioso: -1
  orden_a_tiempo: 3
  orden_vencida: -20
  linea_pendiente_min: -0.05       # costo de WIP: por línea sin asignar, por minuto transcurrido
  zona_critica: -1                 # por zona con u_z = 3 en s', si avanzó el reloj
  accion_invalida: -50
  orden_pendiente_fin_turno: -30

# Supuestos del simulador; ver docs/implementacion.md.
simulacion:
  operarios: 3
  # Demanda por franjas: [minuto de inicio, órdenes por minuto]. Dos picos en el turno.
  perfil_demanda:
    - [0, 0.3]
    - [60, 1.2]
    - [180, 0.4]
    - [270, 1.2]
    - [390, 0.3]
  corte_llegadas_min: 30           # no llegan órdenes en los últimos 30 min del turno
  tiempo_base_min: 4               # desplazamiento a la zona y regreso
  tiempo_por_sku_min: 1.0          # por ubicación visitada
  tiempo_por_linea_min: 0.2        # por línea (tomar y separar en la put-wall)
  max_lineas_orden: 6
  sku_por_zona: 30
  zipf_s: 1.0                      # popularidad de SKU (curva ABC); 0 = uniforme
  deadline_min: [30, 120]
