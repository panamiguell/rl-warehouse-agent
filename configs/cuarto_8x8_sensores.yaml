# EXPERIMENTO ADICIONAL (no es el ambiente oficial): el mismo cuarto 8x8, pero el agente tiene
# sensores de obstáculos (frente, su casilla, izquierda y derecha). Sirve para medir cuánto vale
# la información que el curso no le da al agente.

salida: results/cuarto_8x8_sensores

ambiente:
  tamano: 8                 # cuarto de 8x8; inicio (0,0) mirando al norte, meta (7,7)
  obstaculos: 5             # se mueven al azar en cada paso, al mismo tiempo que el agente
  percepcion: true          # EXPERIMENTO ADICIONAL: sensores de obstáculos (no es la regla del curso)
  salvaguarda_pasos: 1000   # corte de seguridad del simulador (el MDP no tiene límite de pasos)
  recompensas:
    meta: 100               # llegar a (7,7)
    colision: -100          # chocar con un obstáculo (casilla compartida o cruce)
    paso: -1                # cada AVANZAR que no termina el episodio
    giro: -1                # cada giro que no termina el episodio
    accion_invalida: -10    # AVANZAR contra la pared (solo si no se usa la máscara A(s))

entrenamiento:
  episodios: 200000
  gamma: 0.99               # sin límite de pasos, girar sin fin en la salida vale -1/(1-γ) = -100
  alpha_potencia: 0.7       # tasa por visitas: α(s,a) = max(alpha_minima, N(s,a)^-0.7)
  alpha_minima: 0.01
  epsilon_inicial: 1.0
  epsilon_minimo: 0.05      # se alcanza al 80 % del entrenamiento (decaimiento geométrico)
  semilla: 0
