# Especificación de la ENTREGA 1 (PDF entregado el 4 de noviembre), sin cambios.
# Mismo escenario de demanda que configs/env_default.yaml para que la comparación sea justa.
# Se usa como línea base del reporte final: python experiments/train.py --config configs/env_entrega1.yaml

episodio:
  duracion_turno_min: 480      # 8 horas
  delta_t_min: 2               # avance del reloj con ESPERAR
  reloj_max_delta: false       # tras asignar al último operario, el reloj salta hasta que uno quede libre
  gamma: 0.99                  # "se recomienda gamma = 0,99 por decisión" (sección 4.3)
  unidad_descuento_min: null   # descuento por decisión

centro_distribucion:
  # Versión tabular de 2 zonas (Entrega 1, sección 2: 9 409 estados). Para las 4 zonas: --zones ABCD.
  zonas: [A, B]
  capacidad_carro_lineas: 20   # Cmax

discretizacion:
  wip_lineas: [0, 5, 15]           # w_z: 0 | 1-5 | 6-15 | 16+
  consolidacion_ordenes: [1, 4]    # c_z: sin repetidos | 2-4 | 5+
  holgura_min: [15, 60]            # u_z: <=15 critica | 15-60 | >60
  operarios_max: 3                 # o: 0, 1, 2, 3+
  llegadas_15min: [5, 15]          # lambda: <5 | 5-15 | >15

recompensas:
  esquema: entrega1
  lote_consolidacion: {0: 1, 1: 5, 2: 10}   # P_c(c_z)
  lote_bono_urgencia: {1: 0, 2: 3, 3: 8}     # B_u(u_z)
  lote_descuido: -6
  urgente: {1: -4, 2: 1, 3: 8}               # según u_max
  esperar:
    sin_alternativa: 0
    sin_trabajo: 0
    con_orden_critica: -10
    consolidar_alta_demanda: 2
    sin_llegadas: -3
    ocioso: -1
  orden_a_tiempo: 3
  orden_vencida: -20
  zona_saturada: -2                # por zona con w_z = 3 en s', si avanzó el reloj
  accion_invalida: -50
  orden_pendiente_fin_turno: -30

# Supuestos del simulador; ver docs/implementacion.md.
simulacion:
  operarios: 3
  # Demanda por franjas: [minuto de inicio, órdenes por minuto]. Dos picos en el turno.
  perfil_demanda:
    - [0, 0.3]
    - [60, 1.2]
    - [180, 0.4]
    - [270, 1.2]
    - [390, 0.3]
  corte_llegadas_min: 30           # no llegan órdenes en los últimos 30 min del turno
  tiempo_base_min: 4               # desplazamiento a la zona y regreso
  tiempo_por_sku_min: 1.0          # por ubicación visitada
  tiempo_por_linea_min: 0.2        # por línea (tomar y separar en la put-wall)
  max_lineas_orden: 6
  sku_por_zona: 30
  zipf_s: 1.0                      # popularidad de SKU (curva ABC); 0 = uniforme
  deadline_min: [30, 120]
