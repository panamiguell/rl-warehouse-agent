[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-warehouse-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "gymnasium>=0.29", "pyyaml>=6.0", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
